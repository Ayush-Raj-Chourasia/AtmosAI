version: '3'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      # Optional: connect to a real Postgres/PostGIS instance.
      # Leave unset to run in zero-config in-memory mode.
      - DATABASE_URL=${DATABASE_URL:-}
    restart: unless-stopped
    networks:
      - nweis_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      # Optional: enables Google sign-in on the citizen mobile app.
      # Leave unset to run without authentication.
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - nweis_network

networks:
  nweis_network:
    driver: bridge
